# Fitness Gurukul — static site on Netlify
# Root has package.json (no deps) for Node install only.
# Do NOT put requirements.txt / runtime.txt at repo root — Netlify's
# Python detect+install stage fails and leaves production on an old deploy.

[build]
  publish = "dist"
  command = "bash scripts/prepare-netlify-dist.sh"

[build.environment]
  NODE_VERSION = "20"
  GIT_LFS_ENABLED = "false"
  GIT_LFS_SKIP_SMUDGE = "1"
  NETLIFY_USE_YARN = "false"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-FG-Deploy = "netlify-static"

[[headers]]
  for = "/backend.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/office.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/owner-data.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
