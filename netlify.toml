# Fitness Gurukul static site on Netlify (no Git LFS)

[build]
  publish = "dist"
  command = "node scripts/prepare-netlify-dist.js"

[build.environment]
  NODE_VERSION = "20"
  GIT_LFS_ENABLED = "false"
  GIT_LFS_SKIP_SMUDGE = "1"
  NPM_FLAGS = "--ignore-scripts"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/backend.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/office.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/owner-data.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
