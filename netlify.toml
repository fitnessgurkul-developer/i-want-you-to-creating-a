# Fitness Gurukul — static site only.
# No root package.json / requirements.txt so dependency install cannot fail.

[build]
  publish = "dist"
  command = "bash scripts/prepare-netlify-dist.sh"

[build.environment]
  NODE_VERSION = "20"
  GIT_LFS_ENABLED = "false"
  GIT_LFS_SKIP_SMUDGE = "1"
  NETLIFY_USE_YARN = "false"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-FG-Deploy = "netlify-static"

[[headers]]
  for = "/backend.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/office.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/owner-data.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/backend"
  to = "/backend.html"
  status = 301

[[redirects]]
  from = "/office"
  to = "/backend.html"
  status = 301

[[redirects]]
  from = "/owner"
  to = "/backend.html"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/backend.html"
  status = 301
