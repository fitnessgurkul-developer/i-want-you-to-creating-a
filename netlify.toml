# Fitness Gurukul — static site on Netlify
# No root package.json / requirements.txt on purpose so the
# "Install dependencies" stage has nothing to install (avoids exit code 1).

[build]
  publish = "dist"
  command = "bash scripts/prepare-netlify-dist.sh"

[build.environment]
  NODE_VERSION = "20"
  GIT_LFS_ENABLED = "false"
  GIT_LFS_SKIP_SMUDGE = "1"
  # Do not auto-select Yarn/PNPM
  NETLIFY_USE_YARN = "false"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-FG-Deploy = "netlify-static"

[[headers]]
  for = "/backend.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/office.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/owner-data.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
