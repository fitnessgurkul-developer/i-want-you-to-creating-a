# Publish static site to the gh-pages branch.
# Does NOT use actions/deploy-pages (that API 404s until Pages is enabled
# for "GitHub Actions" in repo settings — we can't enable that from here).
#
# One-time owner step (if the site URL still 404s):
#   Settings → Pages → Build and deployment
#   Source: Deploy from a branch
#   Branch: gh-pages / (root) → Save
# Site: https://saikrishnacoder.github.io/i-want-you-to-creating-a/

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Prepare static dist
        run: bash scripts/prepare-netlify-dist.sh

      - name: Add Pages nojekyll + deploy stamp
        run: |
          touch dist/.nojekyll
          printf '%s\n' "deploy=$(git rev-parse --short HEAD)" "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/deploy-version.txt

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          full_commit_message: "Deploy ${{ github.sha }}"

      - name: Print site URL
        run: |
          echo "Published dist/ to branch gh-pages."
          echo "Site (after Pages source = gh-pages): https://saikrishnacoder.github.io/i-want-you-to-creating-a/"
