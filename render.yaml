services:
  - type: web
    name: fitness-gurukul-api
    runtime: python
    plan: free
    # API does not need Git LFS gallery binaries — skip smudge or clone fails when LFS budget is exceeded.
    buildCommand: "GIT_LFS_SKIP_SMUDGE=1 git lfs install --skip-smudge || true; python -c \"print('stdlib api ready')\""
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      # Critical: Render clone runs with these env vars. Without SKIP_SMUDGE, LFS budget errors abort deploy.
      - key: GIT_LFS_SKIP_SMUDGE
        value: "1"
      - key: GIT_LFS_ENABLED
        value: "false"
      # Keep the token already set in the Render dashboard (do not regenerate).
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LEAD_NOTIFY_MODE
        value: "both"
      - key: LEAD_NOTIFY_EMAIL
        value: "contact@fitnessgurukul.co.in,fitnessgurukul01@gmail.com"
      # Ephemeral on free tier; email is the durable copy of each lead.
      # After you attach a disk at /var/data (paid), set DATA_DIR=/var/data in the dashboard.
      - key: DATA_DIR
        value: "/opt/render/project/src/data"
