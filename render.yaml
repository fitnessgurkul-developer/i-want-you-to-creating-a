services:
  - type: web
    name: fitness-gurukul-api
    runtime: python
    plan: free
    # No requirements.txt — server.py is stdlib only.
    buildCommand: "python -c \"print('stdlib api ready')\""
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      # Skip Git LFS downloads during clone/checkout. The GitHub LFS budget
      # is exceeded; the API does not need gallery/media binaries.
      - key: GIT_LFS_SKIP_SMUDGE
        value: "1"
      - key: GIT_LFS_ENABLED
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://fitnessgurukul.app,https://www.fitnessgurukul.app,https://fitnessgurukul.co.in,https://www.fitnessgurukul.co.in,https://fitnessgurukul.in,https://www.fitnessgurukul.in"
      - key: PYTHON_VERSION
        value: "3.12.8"
