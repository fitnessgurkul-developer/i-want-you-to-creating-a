services:
  - type: web
    name: fitness-gurukul-api
    runtime: python
    plan: free
    # No requirements.txt — server.py is stdlib only.
    buildCommand: "python -c \"print('stdlib api ready')\""
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LEAD_NOTIFY_MODE
        value: "both"
      - key: LEAD_NOTIFY_EMAIL
        value: "contact@fitnessgurukul.co.in,fitnessgurukul01@gmail.com"
