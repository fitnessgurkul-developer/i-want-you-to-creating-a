# Sole cloud API host for Fitness Gurukul (frontend is Hostinger).
services:
  - type: web
    name: fitness-gurukul-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://fitnessgurukul.app,https://www.fitnessgurukul.app,https://fitnessgurukul.co.in,https://www.fitnessgurukul.co.in,https://fitnessgurukul.in,https://www.fitnessgurukul.in"
      - key: PYTHON_VERSION
        value: "3.12.8"
