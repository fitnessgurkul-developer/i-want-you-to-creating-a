services:
  - type: web
    name: fitness-gurukul-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip
    startCommand: python -u server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: ADMIN_TOKEN
        generateValue: true
      # Writable path inside the service; do NOT use /var/data without a Render Disk.
      - key: DATA_DIR
        value: "./data"
      - key: CORS_ORIGINS
        value: "https://fitnessgurukul.app,https://www.fitnessgurukul.app,https://fitnessgurukul.co.in,https://www.fitnessgurukul.co.in,https://soft-chimera-8a4214.netlify.app,https://jade-puppy-0909d4.netlify.app,https://saikrishnacoder.github.io"
