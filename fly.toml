app = "fitness-gurukul-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  CORS_ORIGINS = "https://fitnessgurukul.app,https://www.fitnessgurukul.app,https://www.fitnessgurukul.co.in,https://fitnessgurukul.co.in,https://www.fitnessgurukul.in,https://fitnessgurukul.in,http://localhost:8000,http://127.0.0.1:8000"
