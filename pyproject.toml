[project]
name = "fitness-gurukul-api"
version = "0.1.0"
description = "Fitness Gurukul Python API (stdlib HTTP server)"
requires-python = ">=3.12"
# No third-party deps — server.py uses the standard library only.
dependencies = []

# Explicit entrypoint for Vercel Python runtime detection.
# https://vercel.com/docs/functions/runtimes/python#python-entrypoints
[tool.vercel]
entrypoint = "server:handler"
